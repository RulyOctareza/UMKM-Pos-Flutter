name: umkm_pos
description: "Aplikasi POS Kasir Offline-First untuk UMKM Indonesia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database (SQLite type-safe)
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Navigation & Routing
  go_router: ^14.8.1

  # Remote Backend & Sync
  supabase_flutter: ^2.8.3
  connectivity_plus: ^6.1.3

  # UI, Icons, Typography
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.2

  # Testing & Mocking
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
